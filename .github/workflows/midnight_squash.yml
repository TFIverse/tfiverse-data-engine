name: Midnight Squash Data Compressor

on:
  schedule:
    - cron: '25 18 * * *' # 11:55 PM IST (18:25 UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  squash-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install boto3

      - name: Run Midnight Squash
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: "tfiverse-backups"
          B2_ENDPOINT: "s3.us-west-004.backblazeb2.com"
        run: python src/combiner/midnight_squash.py
