name: Live Box Office Scraper

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  scrape-shards:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run BMS Scraper Shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 9
        run: python src/scrapers/bms_async.py

      - name: Run Paytm Scraper Shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 9
        run: python src/scrapers/paytm_async.py

      - name: Run Sacnilk Scraper (Shard 0 only)
        if: matrix.shard == 0
        run: python src/scrapers/sacnilk.py

      - name: Upload Shard Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: shards-data
          path: data/*.json
          retention-days: 1

  combine-and-commit:
    needs: scrape-shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Shard Artifacts
        uses: actions/download-artifact@v3
        with:
          name: shards-data
          path: data/

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Combine Shards
        run: python src/combiner/aggregate.py

      - name: Commit and Push
        run: |
          git config --global user.name 'TFIVerse Data Engine'
          git config --global user.email 'data-engine@tfiverse.com'
          git add data/latest_*.json data/sacnilk_data.json
          git commit -m "🚀 Auto-update live box office data [skip ci]" || echo "No changes to commit"
          git push
